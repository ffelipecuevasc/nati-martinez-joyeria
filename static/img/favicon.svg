<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Natalia Martínez — Orfebrería">
    <style>
        .bg   { fill: #F5F1E8; }
        .ring { fill: none; stroke: #A76545; }
        .mark { fill: #5A4035; }
        .spark{ fill: #A76545; }
        @media (prefers-color-scheme: dark) {
        .bg   { fill: #201B18; }
        .ring { stroke: #B87352; }
        .mark { fill: #E6E2D8; }
        .spark{ fill: #B87352; }
        }
    </style>

    <circle class="bg" cx="32" cy="32" r="31"/>
    <circle class="ring" cx="32" cy="32" r="30" stroke-width="1.25"/>
    <circle class="ring" cx="32" cy="32" r="26.5" stroke-width="0.75" opacity="0.7"/>

    <g class="mark">
        <rect x="20" y="19" width="4" height="26"/>
        <rect x="40" y="19" width="4" height="26"/>
        <polygon points="20,19 27,19 44,45 37,45"/>
        <rect x="17.5" y="18" width="9" height="2.2"/>
        <rect x="37.5" y="18" width="9" height="2.2"/>
        <rect x="17.5" y="43.8" width="9" height="2.2"/>
        <rect x="37.5" y="43.8" width="9" height="2.2"/>
    </g>

    <circle class="spark" cx="32" cy="52.5" r="1.5"/>
</svg>